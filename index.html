<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آلبوم تیام جان</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,sans-serif;background:linear-gradient(160deg,#eaf6fd,#f2fbf5 45%,#fdf8ef);min-height:100vh;color:#123f3a}header{text-align:center;padding:44px 16px 10px}h1{font-size:clamp(2rem,6vw,3.2rem);color:#123f3a}h1 b{color:#e8554a}.age{display:inline-block;background:#fff3cd;border:2px solid #f2c14e;color:#8a6100;border-radius:999px;padding:.3rem 1rem;font-weight:bold;font-size:.88rem;margin-top:.5rem}.cnt{color:#4c6b66;font-size:.85rem;margin-top:.7rem}.grid{columns:230px;column-gap:18px;max-width:1080px;margin:26px auto;padding:0 18px 50px}.p{background:#fff;padding:9px 9px 11px;border-radius:5px;margin:0 0 18px;break-inside:avoid;position:relative;box-shadow:0 8px 20px rgba(18,63,58,.13);transform:rotate(var(--t));transition:.3s;cursor:zoom-in}.p:hover{transform:rotate(0) translateY(-6px);box-shadow:0 18px 34px rgba(18,63,58,.22)}.sk{position:absolute;top:8px;right:8px;font-size:1.5rem;z-index:2}.fv{position:absolute;top:8px;left:8px;font-size:1rem;z-index:2}.im{line-height:0;background:#eef4f2}.im img{width:100%;display:block}figcaption{display:flex;justify-content:space-between;gap:8px;padding-top:9px;align-items:baseline}.c{font-weight:bold;font-size:.88rem;color:#214f49;flex:1}.d{font-size:.68rem;color:#8aa6a1;white-space:nowrap}#msg{text-align:center;padding:40px 20px;color:#4c6b66;font-size:1.05rem}#lb{position:fixed;inset:0;background:rgba(10,32,29,.93);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}#lb img{max-width:90vw;max-height:48vh;background:#fff;padding:8px;border-radius:8px;box-shadow:0 30px 70px rgba(0,0,0,.5)}#lbC{color:#fff;font-weight:bold;margin-top:10px;font-size:1rem;text-align:center}#lbD{color:#9fc5be;font-size:.8rem;margin-top:.3rem}#lbN{color:#9fc5be;font-size:.78rem;margin-top:.4rem}.nx{position:absolute;top:30%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:#fff;font-size:1.3rem;cursor:pointer}#pv{right:12px}#nv{left:12px}#xx{position:absolute;top:12px;left:12px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:1.05rem;cursor:pointer}.lb-actions{margin-top:.7rem}.likebtn{background:#fff;border:0;border-radius:999px;padding:.45rem 1.1rem;font-size:.9rem;cursor:pointer;font-weight:bold;color:#e8554a;font-family:inherit}.likebtn.liked{background:#fdecea}.comments{max-width:92vw;width:540px;max-height:180px;overflow:auto;background:#fff;border-radius:14px;margin-top:.7rem;padding:.7rem 1rem;text-align:right}.comment{border-bottom:1px solid #eee;padding:.4rem 0;font-size:.8rem;line-height:1.7}.comment b{color:#14655b}.comment small{color:#8aa6a1;display:block;font-size:.66rem}.cform{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}.cform input{flex:1;min-width:110px;border:1px solid #ccc;border-radius:10px;padding:.45rem .6rem;font-size:.8rem;font-family:inherit}footer{text-align:center;color:#7a9790;font-size:.8rem;padding:0 0 34px}</style></head><body><header><h1>آلبوم <b id="hname">تیام جان</b> 🍼</h1><div class="age" id="hage"></div><div class="cnt" id="hcnt"></div></header><div id="msg">در حال باز کردن آلبوم…</div><div class="grid" id="grid"></div><div id="lb"><button id="xx">✕</button><button class="nx" id="pv">‹</button><button class="nx" id="nv">›</button><img id="lbI" alt=""><div id="lbC"></div><div id="lbD"></div><div id="lbN"></div><div class="lb-actions"><button class="likebtn" id="likeBtn">❤️ <span id="likeCount">۰</span></button></div><div class="comments"><div id="commentsList"></div><div class="cform"><input id="cname" placeholder="اسم (اختیاری)"><input id="cmsg" placeholder="یه یادگاری بنویس…"><button class="likebtn" id="cSend">ثبت یادگاری</button></div></div></div><footer>ساخته‌شده با ❤ برای تیام جان</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>var CFG={"url":"https://sgbvqmceylcksfxeeowd.supabase.co","anon":"sb_publishable_YkAK9G-WcyjAmfHn-I7v2A_brXbzBZv"};var ALBUMID="527b413e-4422-4c31-a37f-51dc7ceef735";var sb=supabase.createClient(CFG.url,CFG.anon);function fa(n){return Number(n).toLocaleString("fa-IR")}function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}function ageStr(bd){var b=parseD(bd),n=new Date();var m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());var d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0)return"";var y=Math.floor(m/12),mm=m%12,t="🎂 ";if(y)t+=fa(y)+" سال و ";if(mm||y)t+=fa(mm)+" ماه و ";return t+fa(d)+" روزه · متولد "+parseD(bd).toLocaleDateString("fa-IR",{year:"numeric",month:"long",day:"numeric"})}var _ph=[],cur=-1,curId=null;async function loadSocial(pid){var lb2=document.getElementById("likeBtn");var lc=document.getElementById("likeCount");var cl=document.getElementById("commentsList");try{var lr=await sb.from("likes").select("id").eq("photo_id",pid);lc.textContent=fa(lr.data?lr.data.length:0);if(localStorage.getItem("liked_"+pid)){lb2.classList.add("liked")}else{lb2.classList.remove("liked")}var cr=await sb.from("comments").select("*").eq("photo_id",pid).order("created_at",{ascending:true});var cm=cr.data||[];cl.innerHTML="";if(cm.length===0){var d0=document.createElement("div");d0.className="comment";d0.textContent="هنوز یادگاری نیست. اولین نفر باش! 🌸";cl.appendChild(d0);}for(var i=0;i<cm.length;i++){var d=document.createElement("div");d.className="comment";var b=document.createElement("b");b.textContent=cm[i].author+" :";var sp=document.createElement("span");sp.textContent=" "+cm[i].message;var sm=document.createElement("small");sm.textContent=new Date(cm[i].created_at).toLocaleDateString("fa-IR");d.appendChild(b);d.appendChild(sp);d.appendChild(sm);cl.appendChild(d);}}catch(e){}}document.getElementById("likeBtn").onclick=function(){doLike(curId)};document.getElementById("cSend").onclick=function(){addComment(curId)};async function doLike(pid){if(!pid)return;if(localStorage.getItem("liked_"+pid))return;await sb.from("likes").insert({photo_id:pid});localStorage.setItem("liked_"+pid,"1");loadSocial(pid);}async function addComment(pid){if(!pid)return;var name=document.getElementById("cname").value.trim()||"مهمان";var msg=document.getElementById("cmsg").value.trim();if(!msg)return;await sb.from("comments").insert({photo_id:pid,author:name,message:msg});document.getElementById("cmsg").value="";loadSocial(pid);}async function boot(){var m=document.getElementById("msg");try{var ar=await sb.from("albums").select("*").eq("id",ALBUMID).maybeSingle();if(!ar.data){m.textContent="آلبوم پیدا نشد 😢";return}var a=ar.data;document.title="آلبوم "+a.name;document.getElementById("hname").textContent=a.name;if(a.bday){document.getElementById("hage").textContent=ageStr(a.bday)}else{document.getElementById("hage").style.display="none"}var pr=await sb.from("photos").select("*").eq("album_id",ALBUMID).order("added_at",{ascending:true});_ph=pr.data||[];document.getElementById("hcnt").textContent=fa(_ph.length)+" عکس از خاطرات "+a.name;if(_ph.length===0){m.textContent="هنوز عکسی در این آلبوم نیست 🧸";return}m.style.display="none";var grid=document.getElementById("grid");for(var i=0;i<_ph.length;i++){(function(i){var p=_ph[i];var f=document.createElement("figure");f.className="p";f.style.setProperty("--t",(((i%5)-2)*1.4)+"deg");if(p.sticker){var sk=document.createElement("span");sk.className="sk";sk.textContent=p.sticker;f.appendChild(sk)}if(p.fav){var fv=document.createElement("span");fv.className="fv";fv.textContent="❤️";f.appendChild(fv)}var im=document.createElement("div");im.className="im";var img=document.createElement("img");img.loading="lazy";img.src=p.url;im.appendChild(img);f.appendChild(im);var fc=document.createElement("figcaption");var c=document.createElement("span");c.className="c";c.textContent=p.caption||"";var d=document.createElement("span");d.className="d";d.textContent=new Date(p.added_at).toLocaleDateString("fa-IR");fc.appendChild(c);fc.appendChild(d);f.appendChild(fc);f.onclick=function(){openLB(i)};grid.appendChild(f);})(i)}}catch(e){m.textContent="خطا در اتصال 😢";m.style.display="block"}}function openLB(i){cur=i;upd();document.getElementById("lb").style.display="flex"}function upd(){var p=_ph[cur];document.getElementById("lbI").src=p.url;document.getElementById("lbC").textContent=p.caption||"";document.getElementById("lbD").textContent=(p.sticker?p.sticker+" · ":"")+new Date(p.added_at).toLocaleDateString("fa-IR");document.getElementById("lbN").textContent=fa(cur+1)+" / "+fa(_ph.length);curId=p.id;loadSocial(p.id);}function step(d){cur=(cur+d+_ph.length)%_ph.length;upd()}document.getElementById("xx").onclick=function(){document.getElementById("lb").style.display="none"};document.getElementById("pv").onclick=function(){step(1)};document.getElementById("nv").onclick=function(){step(-1)};document.addEventListener("keydown",function(e){if(document.getElementById("lb").style.display!=="flex")return;if(e.key==="Escape")document.getElementById("lb").style.display="none";else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1)});boot();</script></body></html>
