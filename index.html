ocument.getElementById("hname").textContent=a.name;if(a.bday){document.getElementById("hage").textContent=ageStr(a.bday)}else{document.getElementById("hage").style.display="none"}var pr=await sb.from("photos").select("*").eq("album_id",ALBUMID).order("added_at",{ascending:true});_ph=pr.data||[];document.getElementById("hcnt").textContent=fa(_ph.length)+" عکس از خاطرات "+a.name;if(_ph.length===0){m.textContent="هنوز عکسی در این آلبوم نیست 🧸";return}m.style.display="none";var grid=document.getElementById("grid");for(var i=0;i<_ph.length;i++){(function(i){var p=_ph[i];var f=document.createElement("figure");f.className="p";f.style.setProperty("--t",(((i%5)-2)*1.4)+"deg");if(p.sticker){var sk=document.createElement("span");sk.className="sk";sk.textContent=p.sticker;f.appendChild(sk)}if(p.fav){var fv=document.createElement("span");fv.className="fv";fv.textContent="❤️";f.appendChild(fv)}var im=document.createElement("div");im.className="im";var img=document.createElement("img");img.loading="lazy";img.src=p.url;im.appendChild(img);f.appendChild(im);var fc=document.createElement("figcaption");var c=document.createElement("span");c.className="c";c.textContent=p.caption||"";var d=document.createElement("span");d.className="d";d.textContent=new Date(p.added_at).toLocaleDateString("fa-IR");fc.appendChild(c);fc.appendChild(d);f.appendChild(fc);f.onclick=function(){openLB(i)};grid.appendChild(f);})(i)}}catch(e){m.textContent="خطا در اتصال 😢";m.style.display="block"}}function openLB(i){cur=i;upd();document.getElementById("lb").style.display="flex"}function upd(){var p=_ph[cur];document.getElementById("lbI").src=p.url;document.getElementById("lbC").textContent=p.caption||"";document.getElementById("lbD").textContent=(p.sticker?p.sticker+" · ":"")+new Date(p.added_at).toLocaleDateString("fa-IR");document.getElementById("lbN").textContent=fa(cur+1)+" / "+fa(_ph.length)}function step(d){cur=(cur+d+_ph.length)%_ph.length;upd()}document.getElementById("xx").onclick=function(){document.getElementById("lb").style.display="none"};document.getElementById("pv").onclick=function(){step(1)};document.getElementById("nv").onclick=function(){step(-1)};document.addEventListener("keydown",function(e){if(document.getElementById("lb").style.display!=="flex")return;if(e.key==="Escape")document.getElementById("lb").style.display="none";else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1)});boot();</script></body></html>
