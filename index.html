<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آلبوم تیام جان 🍼</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,sans-serif;min-height:100vh;color:#123f3a;overflow-x:hidden;background:linear-gradient(135deg,#eaf6fd 0%,#f2fbf5 40%,#fdf3e7 75%,#fdeef0 100%);background-attachment:fixed}.fl{position:fixed;font-size:22px;opacity:.35;pointer-events:none;z-index:0;animation:floaty 9s ease-in-out infinite}@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-34px) rotate(8deg)}}header{text-align:center;padding:50px 16px 14px;position:relative;z-index:2}h1{font-size:clamp(2.3rem,7vw,3.6rem);font-weight:900;letter-spacing:-1px}h1 b{background:linear-gradient(135deg,#ff6b5e,#ff9a6b);-webkit-background-clip:text;background-clip:text;color:transparent}.age{display:inline-block;background:#fff3cd;border:2px solid #f2c14e;color:#8a6100;border-radius:999px;padding:.35rem 1.1rem;font-weight:bold;font-size:.9rem;margin-top:.6rem;box-shadow:0 4px 12px rgba(242,193,78,.3)}.cnt{color:#4c6b66;font-size:.9rem;margin-top:.8rem}.grid{columns:240px;column-gap:20px;max-width:1100px;margin:28px auto;padding:0 18px 60px;position:relative;z-index:2}.p{background:#fff;padding:10px 10px 12px;border-radius:10px;margin:0 0 22px;break-inside:avoid;position:relative;box-shadow:0 10px 26px rgba(18,63,58,.14);transform:rotate(var(--t));transition:.35s;cursor:zoom-in}.p:hover{transform:rotate(0) translateY(-8px) scale(1.02);box-shadow:0 22px 44px rgba(18,63,58,.24);z-index:3}.p::before{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);width:90px;height:24px;background:rgba(255,211,77,.8);border-radius:2px;box-shadow:0 3px 6px rgba(0,0,0,.08)}.sk{position:absolute;top:10px;right:10px;font-size:1.6rem;z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}.fv{position:absolute;top:10px;left:10px;font-size:1.1rem;z-index:2}.im{line-height:0;border-radius:6px;overflow:hidden;background:#eef4f2}.im img{width:100%;display:block;transition:.4s}.p:hover .im img{transform:scale(1.05)}figcaption{display:flex;justify-content:space-between;gap:8px;padding-top:10px;align-items:baseline}.c{font-weight:bold;font-size:.88rem;color:#214f49;flex:1}.d{font-size:.68rem;color:#8aa6a1;white-space:nowrap}#msg{text-align:center;padding:44px 20px;color:#4c6b66;font-size:1.05rem;position:relative;z-index:2}#lb{position:fixed;inset:0;background:rgba(10,32,29,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}#lb img{max-width:90vw;max-height:46vh;background:#fff;padding:8px;border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.5)}#lbC{color:#fff;font-weight:bold;margin-top:10px;font-size:1rem;text-align:center}#lbD{color:#9fc5be;font-size:.8rem;margin-top:.3rem}#lbN{color:#9fc5be;font-size:.78rem;margin-top:.4rem}.nx{position:absolute;top:28%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3)}#pv{right:12px}#nv{left:12px}#xx{position:absolute;top:12px;left:12px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:1.05rem;cursor:pointer}.lb-actions{margin-top:.8rem}.likebtn{background:#fff;border:0;border-radius:999px;padding:.5rem 1.3rem;font-size:.95rem;cursor:pointer;font-weight:bold;color:#e8554a;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:.2s}.likebtn:hover{transform:scale(1.06)}.likebtn.liked{background:#fdecea}.comments{max-width:92vw;width:560px;max-height:190px;overflow:auto;background:#fff;border-radius:16px;margin-top:.8rem;padding:.8rem 1rem;text-align:right;box-shadow:0 8px 24px rgba(0,0,0,.25)}.comment{border-bottom:1px solid #f0eee8;padding:.5rem 0;font-size:.82rem;line-height:1.7}.comment:last-child{border-bottom:none}.comment b{color:#14655b}.comment small{color:#8aa6a1;display:block;font-size:.66rem}.cform{display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap}.cform input{flex:1;min-width:110px;border:2px solid #e3f2ee;border-radius:12px;padding:.5rem .7rem;font-size:.82rem;font-family:inherit}.cform input:focus{outline:none;border-color:#14655b}.burst{position:fixed;pointer-events:none;z-index:99;font-size:20px;transition:all 1.1s ease-out}footer{text-align:center;color:#7a9790;font-size:.8rem;padding:0 0 40px;position:relative;z-index:2}</style></head><body><header><h1>آلبوم <b id="hname">تیام جان</b> 🍼</h1><div class="age" id="hage"></div><div class="cnt" id="hcnt"></div></header><div id="msg">در حال باز کردن آلبوم…</div><div class="grid" id="grid"></div><div id="lb"><button id="xx">✕</button><button class="nx" id="pv">‹</button><button class="nx" id="nv">›</button><img id="lbI" alt=""><div id="lbC"></div><div id="lbD"></div><div id="lbN"></div><div class="lb-actions"><button class="likebtn" id="likeBtn">❤️ <span id="likeCount">۰</span></button></div><div class="comments"><div id="commentsList"></div><div class="cform"><input id="cname" placeholder="اسم (اختیاری)"><input id="cmsg" placeholder="یه یادگاری بنویس…"><button class="likebtn" id="cSend">ثبت 🌸</button></div></div></div><footer>ساخته‌شده با ❤ برای تیام جان</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>var CFG={"url":"https://kabgmypavsagbomdvzga.supabase.co","anon":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYmdteXBhdnNhZ2JvbWR2emdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Njc0NzksImV4cCI6MjEwMjA0MzQ3OX0.6kNctpCc7Qmj1bihs9clokk70UzX12-oy-wxlsiJKmY"};var ALBUMID="bb7c5a06-a2d4-4b1a-8167-410ca42de9e1";var sb=supabase.createClient(CFG.url,CFG.anon);function fa(n){return Number(n).toLocaleString("fa-IR")}function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}function ageStr(bd){var b=parseD(bd),n=new Date();var m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());var d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0)return"";var y=Math.floor(m/12),mm=m%12,t="🎂 ";if(y)t+=fa(y)+" سال و ";if(mm||y)t+=fa(mm)+" ماه و ";return t+fa(d)+" روزه · متولد "+parseD(bd).toLocaleDateString("fa-IR",{year:"numeric",month:"long",day:"numeric"})}var DEC=["🧸","🍼","⭐","🌸","💛","🎈"];for(var di=0;di<10;di++){var s=document.createElement("span");s.className="fl";s.textContent=DEC[di%DEC.length];s.style.left=(Math.random()*95)+"%";s.style.top=(Math.random()*95)+"%";s.style.animationDelay=(Math.random()*8)+"s";s.style.fontSize=(16+Math.random()*16)+"px";document.body.appendChild(s);}var _ph=[],cur=-1,curId=null;function heartBurst(){var b=document.getElementById("likeBtn");var r=b.getBoundingClientRect();for(var i=0;i<7;i++){var h=document.createElement("span");h.className="burst";h.textContent="❤️";h.style.left=(r.left+r.width/2)+"px";h.style.top=(r.top)+"px";document.body.appendChild(h);(function(el){setTimeout(function(){el.style.transform="translate("+((Math.random()*120-60))+"px,-"+(90+Math.random()*80)+"px)";el.style.opacity="0";},30);setTimeout(function(){el.remove()},1200);})(h);}}async function loadSocial(pid){var lb2=document.getElementById("likeBtn");var lc=document.getElementById("likeCount");var cl=document.getElementById("commentsList");try{var lr=await sb.from("likes").select("id").eq("photo_id",pid);lc.textContent=fa(lr.data?lr.data.length:0);if(localStorage.getItem("liked_"+pid)){lb2.classList.add("liked")}else{lb2.classList.remove("liked")}var cr=await sb.from("comments").select("*").eq("photo_id",pid).order("created_at",{ascending:true});var cm=cr.data||[];cl.innerHTML="";if(cm.length===0){var d0=document.createElement("div");d0.className="comment";d0.textContent="هنوز یادگاری نیست. اولین نفر باش! 🌸";cl.appendChild(d0);}for(var i=0;i<cm.length;i++){var d=document.createElement("div");d.className="comment";var b=document.createElement("b");b.textContent=(cm[i].author||"مهمان")+" :";var sp=document.createElement("span");sp.textContent=" "+(cm[i].message||"");var sm=document.createElement("small");sm.textContent=new Date(cm[i].created_at).toLocaleDateString("fa-IR");d.appendChild(b);d.appendChild(sp);d.appendChild(sm);cl.appendChild(d);}}catch(e){}}document.getElementById("likeBtn").onclick=function(){doLike(curId)};document.getElementById("cSend").onclick=function(){addComment(curId)};async function doLike(pid){if(!pid)return;if(localStorage.getItem("liked_"+pid))return;await sb.from("likes").insert({photo_id:pid});localStorage.setItem("liked_"+pid,"1");heartBurst();loadSocial(pid);}async function addComment(pid){if(!pid)return;var name=document.getElementById("cname").value.trim()||"مهمان";var msg=document.getElementById("cmsg").value.trim();if(!msg)return;await sb.from("comments").insert({photo_id:pid,author:name,message:msg});document.getElementById("cmsg").value="";loadSocial(pid);}async function boot(){var m=document.getElementById("msg");try{var ar=await sb.from("albums").select("*").eq("id",ALBUMID).maybeSingle();if(!ar.data){m.textContent="آلبوم پیدا نشد 😢";return}var a=ar.data;document.title="آلبوم "+a.name+" 🍼";document.getElementById("hname").textContent=a.name;if(a.bday){document.getElementById("hage").textContent=ageStr(a.bday)}else{document.getElementById("hage").style.display="none"}var pr=await sb.from("photos").select("*").eq("album_id",ALBUMID).order("added_at",{ascending:false});_ph=pr.data||[];document.getElementById("hcnt").textContent=fa(_ph.length)+" عکس از خاطرات "+a.name+" ✨";if(_ph.length===0){m.textContent="هنوز عکسی در این آلبوم نیست 🧸";return}m.style.display="none";var grid=document.getElementById("grid");for(var i=0;i<_ph.length;i++){(function(i){var p=_ph[i];var f=document.createElement("figure");f.className="p";f.style.setProperty("--t",(((i%5)-2)*1.4)+"deg");if(p.sticker){var sk=document.createElement("span");sk.className="sk";sk.textContent=p.sticker;f.appendChild(sk)}if(p.fav){var fv=document.createElement("span");fv.className="fv";fv.textContent="❤️";f.appendChild(fv)}var im=document.createElement("div");im.className="im";var img=document.createElement("img");img.loading="lazy";img.src=p.url;im.appendChild(img);f.appendChild(im);var fc=document.createElement("figcaption");var c=document.createElement("span");c.className="c";c.textContent=p.caption||"";var d=document.createElement("span");d.className="d";d.textContent=new Date(p.added_at).toLocaleDateString("fa-IR");fc.appendChild(c);fc.appendChild(d);f.appendChild(fc);f.onclick=function(){openLB(i)};grid.appendChild(f);})(i)}}catch(e){m.textContent="خطا در اتصال 😢";m.style.display="block"}}function openLB(i){cur=i;upd();document.getElementById("lb").style.display="flex"}function upd(){var p=_ph[cur];document.getElementById("lbI").src=p.url;document.getElementById("lbC").textContent=p.caption||"";document.getElementById("lbD").textContent=(p.sticker?p.sticker+" · ":"")+new Date(p.added_at).toLocaleDateString("fa-IR");document.getElementById("lbN").textContent=fa(cur+1)+" / "+fa(_ph.length);curId=p.id;loadSocial(p.id);}function step(d){cur=(cur+d+_ph.length)%_ph.length;upd()}document.getElementById("xx").onclick=function(){document.getElementById("lb").style.display="none"};document.getElementById("pv").onclick=function(){step(1)};document.getElementById("nv").onclick=function(){step(-1)};document.addEventListener("keydown",function(e){if(document.getElementById("lb").style.display!=="flex")return;if(e.key==="Escape")document.getElementById("lb").style.display="none";else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1)});boot();</script></body></html>
