<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍼 آلبوم تیام جان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg1:#eaf6fd;--bg2:#f2fbf5;--bg3:#fdf3e7;--bg4:#fdeef0;
  --text:#123f3a;--text-soft:#4c6b66;--card:rgba(255,255,255,.9);
  --accent:#ff6b5e;--teal:#14655b;--butter:#ffd34d;
  --shadow:rgba(18,63,58,.14);
}
body.night{
  --bg1:#0f1729;--bg2:#1a2340;--bg3:#16213e;--bg4:#1a1a2e;
  --text:#f0f4f8;--text-soft:#94a3b8;--card:rgba(30,41,59,.9);
  --accent:#ff6b5e;--teal:#5eead4;--butter:#fbbf24;
  --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--text);
  min-height:100vh;overflow-x:hidden;
  background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));
  background-size:400% 400%;
  animation:gradientShift 18s ease infinite;
  transition:background .5s;
}
@keyframes gradientShift{
  0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}
}

/* ═══ حباب‌ها و ستاره‌ها ═══ */
.bubble{position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.3);animation:floatUp linear infinite;}
body.night .bubble{background:radial-gradient(circle at 30% 30%,rgba(94,234,212,.2),rgba(94,234,212,.02));border-color:rgba(94,234,212,.2);}
@keyframes floatUp{
  0%{transform:translateY(110vh) scale(.3);opacity:0}10%{opacity:.7}90%{opacity:.7}
  100%{transform:translateY(-120px) scale(1);opacity:0}
}
.star{position:fixed;background:#fff;border-radius:50%;pointer-events:none;z-index:0;display:none;animation:twinkle ease-in-out infinite;}
body.night .star{display:block}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.4)}}

/* ═══ Confetti و قلب ═══ */
.confetti-piece{position:fixed;width:10px;height:14px;top:-20px;z-index:999;pointer-events:none;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.floating-heart{position:fixed;bottom:-30px;z-index:999;pointer-events:none;font-size:28px;animation:heartFloat ease-out forwards;}
@keyframes heartFloat{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-95vh) scale(1.4);opacity:0}}

/* ═══ هدر سینمایی ═══ */
header{position:relative;z-index:2;text-align:center;padding:60px 20px 30px}
.cinema-title{
  font-family:'Lalezar',cursive;font-size:clamp(3rem,10vw,5.5rem);
  font-weight:400;line-height:1.1;margin-bottom:12px;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:0;
}
.cinema-title .word{
  display:inline-block;opacity:0;
  animation:wordIn .9s cubic-bezier(.34,1.56,.64,1) forwards;
  background:linear-gradient(135deg,var(--accent),#ff9a6b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 12px rgba(255,107,94,.3));
}
.cinema-title .word-space{display:inline-block;width:0.35em}
@keyframes wordIn{
  from{opacity:0;transform:translateY(60px) scale(.5)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.quote{font-size:clamp(.95rem,2.5vw,1.2rem);color:var(--text-soft);max-width:600px;margin:0 auto 24px;line-height:1.9;
  opacity:0;animation:fadeInUp 1s ease .6s forwards;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.age-counter{
  display:inline-flex;flex-wrap:wrap;gap:10px;justify-content:center;
  background:var(--card);backdrop-filter:blur(10px);border-radius:24px;padding:16px 28px;
  box-shadow:0 10px 40px var(--shadow);opacity:0;animation:fadeInUp 1s ease .9s forwards;
}
.age-unit{text-align:center;min-width:58px}
.age-num{font-family:'Lalezar',cursive;font-size:2rem;color:var(--accent);line-height:1;display:block;}
.age-num.tick{animation:numPop .5s ease}
@keyframes numPop{0%{transform:scale(1)}50%{transform:scale(1.3);color:var(--butter)}100%{transform:scale(1)}}
.age-label{font-size:.7rem;color:var(--text-soft);font-weight:700}
.birth-date{font-size:.8rem;color:var(--text-soft);margin-top:10px;opacity:0;animation:fadeInUp 1s ease 1.2s forwards;}

/* ═══ دکمه‌ی شب/روز ═══ */
.night-toggle{position:fixed;top:20px;left:20px;z-index:100;width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
  background:var(--card);backdrop-filter:blur(10px);font-size:1.5rem;box-shadow:0 8px 24px var(--shadow);transition:transform .3s;}
.night-toggle:hover{transform:scale(1.1) rotate(20deg)}

/* ═══ نوار ابزار ═══ */
.toolbar{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:0 20px 30px;}
.lucky-btn{font-family:'Vazirmatn',sans-serif;font-weight:700;font-size:.95rem;
  background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff;border:0;border-radius:16px;padding:12px 24px;cursor:pointer;
  box-shadow:0 8px 24px rgba(139,92,246,.35);transition:.3s;display:flex;align-items:center;gap:8px;}
.lucky-btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(139,92,246,.45)}
.stat-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat-chip{background:var(--card);backdrop-filter:blur(10px);border-radius:999px;padding:8px 16px;font-size:.8rem;font-weight:700;
  color:var(--text-soft);box-shadow:0 4px 16px var(--shadow);display:flex;align-items:center;gap:6px;}
.stat-chip b{color:var(--accent);font-family:'Lalezar',cursive;font-size:1.1rem}

/* ═══ تایم‌لاین مرکزی ═══ */
.timeline{position:relative;z-index:2;max-width:800px;margin:0 auto;padding:20px}
.timeline-line{position:absolute;left:50%;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,transparent,var(--teal),var(--accent),transparent);
  transform:translateX(-50%);border-radius:2px;}
.tl-item{position:relative;padding:30px 20px;opacity:0;transform:translateY(40px);
  transition:opacity .7s ease,transform .7s ease;max-width:100%;}
.tl-item.visible{opacity:1;transform:translateY(0)}
.tl-dot{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
  background:var(--accent);border:4px solid var(--card);box-shadow:0 0 0 3px var(--accent),0 4px 12px var(--shadow);z-index:3;}
.tl-date{display:block;text-align:center;margin-bottom:18px;margin-top:10px}
.tl-date span{display:inline-block;background:var(--butter);color:#7a5a00;font-weight:700;font-size:.75rem;
  padding:4px 12px;border-radius:999px;box-shadow:0 3px 10px rgba(255,211,77,.4);}

/* ═══ قاب‌های متنوع ═══ */
.photo-card{position:relative;cursor:pointer;transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s;
  opacity:0;animation:photoIn .8s cubic-bezier(.34,1.56,.64,1) forwards;max-width:300px;width:100%;margin:0 auto;}
.tl-item img{max-width:100%;height:auto}
@keyframes photoIn{
  from{opacity:0;transform:translateY(30px) scale(.8) rotate(var(--rot,0deg))}
  to{opacity:1;transform:translateY(0) scale(1) rotate(var(--rot,0deg))}
}
.photo-card:hover{transform:translateY(-8px) scale(1.03) rotate(0deg)!important;z-index:5}
.photo-card img{width:100%;display:block;transition:transform .4s}
.frame-polaroid{background:#fff;padding:12px 12px 44px;box-shadow:0 10px 30px var(--shadow);border-radius:4px}
.frame-polaroid .photo-caption{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:'Lalezar',cursive;font-size:1rem;color:#555;}
.frame-polaroid::before{content:'';position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:90px;height:26px;background:rgba(255,211,77,.75);border-radius:2px;z-index:2;}
.frame-tape{background:#fff;padding:10px;box-shadow:0 10px 30px var(--shadow);border-radius:6px}
.frame-tape::before,.frame-tape::after{content:'';position:absolute;width:80px;height:24px;z-index:2;background:rgba(255,107,94,.6);border-radius:2px;}
.frame-tape::before{top:-10px;left:-20px;transform:rotate(-40deg)}
.frame-tape::after{bottom:-10px;right:-20px;transform:rotate(-40deg)}
.frame-rounded{border-radius:20px;overflow:hidden;box-shadow:0 12px 36px var(--shadow)}
.frame-sticker{background:#fff;padding:10px;box-shadow:0 10px 30px var(--shadow);border-radius:12px}
.frame-sticker::after{content:attr(data-sticker);position:absolute;top:-12px;right:-8px;font-size:2rem;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2));z-index:2;}
.frame-film{background:#1a1a1a;padding:24px 12px;border-radius:8px;box-shadow:0 10px 30px var(--shadow);position:relative;}
.frame-film::before,.frame-film::after{content:'';position:absolute;left:8px;right:8px;height:8px;
  background-image:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 14px);opacity:.6;}
.frame-film::before{top:6px}.frame-film::after{bottom:6px}
.frame-film img{border-radius:2px}

/* ═══ لایت‌باکس ═══ */
.lightbox{position:fixed;inset:0;background:rgba(10,20,30,.95);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px);}
.lightbox.open{display:flex;animation:lbIn .3s ease}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:90vw;max-height:60vh;background:#fff;padding:12px;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.lb-caption{color:#fff;font-family:'Lalezar',cursive;font-size:1.4rem;margin-top:16px;text-align:center}
.lb-date{color:#94a3b8;font-size:.85rem;margin-top:4px}
.lb-close{position:absolute;top:20px;right:20px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.4rem;cursor:pointer;transition:.3s;}
.lb-close:hover{background:var(--accent);transform:rotate(90deg)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.6rem;cursor:pointer;transition:.3s;}
.lb-nav:hover{background:var(--accent)}
.lb-prev{right:20px}.lb-next{left:20px}
.lb-like{margin-top:20px;background:rgba(255,255,255,.1);border:2px solid var(--accent);color:#fff;border-radius:999px;padding:12px 32px;font-size:1.1rem;font-weight:700;cursor:pointer;font-family:'Vazirmatn',sans-serif;transition:.3s;display:flex;align-items:center;gap:10px;}
.lb-like:hover{background:var(--accent);transform:scale(1.05)}
.lb-like.liked{background:var(--accent);border-color:var(--accent)}
.lb-like .count{font-family:'Lalezar',cursive;font-size:1.4rem;transition:transform .3s}
.lb-like .count.pop{animation:numPop .5s ease}

/* ═══ دفترچه‌ی یادگاری ═══ */
.memory-book{position:relative;z-index:2;max-width:700px;margin:60px auto;padding:0 20px;}
.memory-book h2{font-family:'Lalezar',cursive;font-size:2.2rem;text-align:center;color:var(--text);margin-bottom:24px;}
.book-page{background:var(--card);backdrop-filter:blur(10px);border-radius:4px 20px 20px 4px;padding:24px;margin-bottom:16px;
  box-shadow:0 8px 24px var(--shadow);position:relative;
  background-image:repeating-linear-gradient(transparent,transparent 28px,rgba(20,101,91,.08) 28px,rgba(20,101,91,.08) 29px);
  border-right:4px solid var(--accent);}
.book-page::before{content:'';position:absolute;top:0;bottom:0;right:20px;width:2px;background:rgba(255,107,94,.3);}
.book-author{font-family:'Lalezar',cursive;font-size:1.1rem;color:var(--teal);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.book-text{color:var(--text);line-height:1.9;font-size:.95rem;padding-right:10px;word-break:break-word}
.book-date{color:var(--text-soft);font-size:.7rem;margin-top:8px;text-align:left}
.book-empty{text-align:center;color:var(--text-soft);padding:30px;font-size:.95rem}
.comment-form{background:var(--card);backdrop-filter:blur(10px);border-radius:20px;padding:20px;box-shadow:0 8px 24px var(--shadow);display:flex;flex-direction:column;gap:12px;}
.comment-form input,.comment-form textarea{font-family:'Vazirmatn',sans-serif;width:100%;border:2px solid rgba(20,101,91,.15);
  border-radius:12px;padding:12px;font-size:.9rem;color:var(--text);background:rgba(255,255,255,.6);resize:none;}
body.night .comment-form input,body.night .comment-form textarea{background:rgba(15,23,42,.6)}
.comment-form input:focus,.comment-form textarea:focus{outline:none;border-color:var(--teal)}
.comment-submit{font-family:'Vazirmatn',sans-serif;font-weight:700;background:linear-gradient(135deg,var(--teal),#0d9488);color:#fff;border:0;border-radius:12px;padding:14px;font-size:1rem;cursor:pointer;transition:.3s;}
.comment-submit:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,101,91,.35)}

/* ═══ عکس‌های لایک‌شده ═══ */
.liked-section{position:relative;z-index:2;max-width:1100px;margin:60px auto;padding:0 20px}
.liked-section h2{font-family:'Lalezar',cursive;font-size:2.2rem;text-align:center;color:var(--text);margin-bottom:24px;}
.liked-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.liked-item{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 6px 20px var(--shadow);transition:.3s;aspect-ratio:1;}
.liked-item:hover{transform:translateY(-6px) scale(1.03)}
.liked-item img{width:100%;height:100%;object-fit:cover}
.liked-item .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;box-shadow:0 3px 8px rgba(255,107,94,.4);}

/* ═══ Toast ═══ */
.toast-box{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;
  background:var(--card);backdrop-filter:blur(10px);border-radius:16px;padding:14px 24px;box-shadow:0 10px 40px var(--shadow);
  font-weight:700;color:var(--text);display:none;align-items:center;gap:10px;border-right:4px solid var(--accent);}
.toast-box.show{display:flex;animation:toastIn .4s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}

footer{position:relative;z-index:2;text-align:center;padding:40px 20px;color:var(--text-soft);font-size:.85rem;}

@media(max-width:768px){
  .age-counter{padding:12px 18px;gap:6px}
  .age-unit{min-width:48px}
  .age-num{font-size:1.6rem}
  .photo-card{max-width:100%}
}
</style>
</head>
<body>

<button class="night-toggle" id="nightToggle" title="حالت شب/روز">🌙</button>

<header>

    <div class="age-unit"><span class="age-num" id="ageMins">۰</span><span class="age-label">دقیقه</span></div>
    <div class="age-unit"><span class="age-num" id="ageSecs">۰</span><span class="age-label">ثانیه</span></div>
  </div>
  <div class="birth-date">🎂 متولد ۱۳ تیر ۱۴۰۵ · ساعت ۱۳:۵۰</div>
</header>

<div class="toolbar">
  <div class="stat-chips">
    <div class="stat-chip">📷 <b id="statPhotos">۰</b> عکس</div>
    <div class="stat-chip">❤️ <b id="statLikes">۰</b> لایک</div>

</div>

<div class="timeline" id="timeline">

</div>

<section class="memory-book">
  <h2>📖 دفترچه‌ی یادگاری</h2>
  <div id="bookPages"></div>
  <form class="comment-form" id="commentForm">
    <input type="text" id="cName" placeholder="اسمت چیه؟ (اختیاری)">

</section>

<section class="liked-section" id="likedSection">

  <div class="liked-grid" id="likedList"></div>
</section>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <img id="lbImg" alt="">
  <div class="lb-caption" id="lbCaption"></div>
  <div class="lb-date" id="lbDate"></div>
  <button class="lb-like" id="lbLike">
    <span>❤️</span>
    <span class="count" id="lbLikeCount">۰</span>
  </button>
</div>

<div class="toast-box" id="toastBox"></div>

<footer>ساخته‌شده با ❤️ برای تیام جان · هر عکس یک خاطره</footer>

function createBackground(){
  for(let i=0;i<15;i++){
    const b=document.createElement("div");

// ═══ هدر سینمایی (تیام جان یکپارچه) ═══
function setupTitle(){
  const words=["تیام","جان"];
  const el=$("#cinemaTitle");
  el.innerHTML="";
  words.forEach((word,wi)=>{
    const span=document.createElement("span");
    span.className="word";
    span.textContent=word;
    span.style.animationDelay=(wi*0.35)+"s";
    el.appendChild(span);
    if(wi<words.length-1){
      const space=document.createElement("span");
      space.className="word-space";
      el.appendChild(space);
    }
  });
}

function setQuote(){
  $("#randomQuote").textContent="« "+QUOTES[Math.floor(Math.random()*QUOTES.length)]+" »";
}

// ═══ شمارنده‌ی سن زنده (از ۱۳ تیر ۱۴۰۵ ساعت ۱۳:۵۰) ═══
let lastSecs=-1;
function updateAge(){
  const birth=new Date(BIRTHDAY);
  const now=new Date();
  let diffSec=Math.floor((now-birth)/1000);
  if(diffSec<0)diffSec=0;
  const days=Math.floor(diffSec/86400);diffSec%=86400;
  const hours=Math.floor(diffSec/3600);diffSec%=3600;
  const mins=Math.floor(diffSec/60);
  const secs=diffSec%60;
  $("#ageDays").textContent=fa(days);
  $("#ageHours").textContent=fa(hours);
  $("#ageMins").textContent=fa(mins);
  const secEl=$("#ageSecs");
  if(secs!==lastSecs){
    secEl.textContent=fa(secs);
    secEl.classList.remove("tick");
    void secEl.offsetWidth;
    secEl.classList.add("tick");
    lastSecs=secs;
  }
}

function fireConfetti(){
  const colors=["#ff6b5e","#ffd34d","#5eead4","#a78bfa","#62b6e8","#ffb4c2"];
  for(let i=0;i<60;i++){
    const p=document.createElement("div");
    p.className="confetti-piece";
    p.style.left=Math.random()*100+"vw";
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=(2.5+Math.random()*2)+"s";
    p.style.animationDelay=(Math.random()*0.5)+"s";
    p.style.borderRadius=Math.random()>0.5?"50%":"2px";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),5000);
  }
}

function heartRain(){
  const hearts=["❤️","💖","💗","💕","💓"];
  for(let i=0;i<10;i++){
    const h=document.createElement("div");
    h.className="floating-heart";
    h.textContent=hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left=(10+Math.random()*80)+"vw";
    h.style.animationDuration=(2+Math.random()*1.5)+"s";
    h.style.animationDelay=(Math.random()*0.5)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  }
}

function toast(msg){
  const t=$("#toastBox");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3000);
}

async function loadData(){
  try{
    const [{data:ph},{data:lk},{data:cm}]=await Promise.all([
      sb.from("photos").select("*").eq("album_id",ALBUM_ID).order("added_at",{ascending:false}),
      sb.from("likes").select("*"),
      sb.from("comments").select("*").order("created_at",{ascending:false})
    ]);
    photos=ph||[];
    likesMap={};
    (lk||[]).forEach(l=>{likesMap[l.photo_id]=(likesMap[l.photo_id]||0)+1;});
    renderTimeline();
    renderComments(cm||[]);
    renderLiked();
    $("#statPhotos").textContent=fa(photos.length);
    $("#statLikes").textContent=fa((lk||[]).length);
    $("#statComments").textContent=fa((cm||[]).length);
  }catch(e){
    console.error(e);
    toast("❌ خطا در بارگذاری");
  }
}

// ═══ تایم‌لاین مرکزی ═══
function renderTimeline(){
  const tl=$("#timeline");
  tl.querySelectorAll(".tl-item").forEach(e=>e.remove());
  if(!photos.length){
    const empty=document.createElement("div");
    empty.style.cssText="text-align:center;color:var(--text-soft);padding:40px;position:relative;z-index:2";
    empty.textContent="هنوز عکسی در آلبوم نیست 🧸";
    tl.appendChild(empty);
    return;
  }
  photos.forEach((p,i)=>{
    const item=document.createElement("div");
    item.className="tl-item";
    const frame=FRAMES[i%FRAMES.length];
    const rot=(Math.random()*4-2).toFixed(1);
    const sticker=STICKERS[Math.floor(Math.random()*STICKERS.length)];
    const likeCount=likesMap[p.id]||0;
    let frameHTML="";
    if(frame==="frame-polaroid"){
      frameHTML=`<div class="photo-card ${frame}" style="--rot:${rot}deg"><img src="${p.url}" alt=""><div class="photo-caption">${p.caption||"تیام جان"}</div></div>`;
    }else if(frame==="frame-sticker"){
      frameHTML=`<div class="photo-card ${frame}" data-sticker="${sticker}" style="--rot:${rot}deg"><img src="${p.url}" alt=""></div>`;
    }else{
      frameHTML=`<div class="photo-card ${frame}" style="--rot:${rot}deg"><img src="${p.url}" alt=""></div>`;
    }
    item.innerHTML=`
      <div class="tl-dot"></div>
      <div class="tl-date"><span>${faDate(p.added_at)} ${likeCount>0?"· ❤️"+fa(likeCount):""}</span></div>
      ${frameHTML}
    `;
    item.querySelector(".photo-card").onclick=()=>openLB(i);
    tl.appendChild(item);
  });
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("visible");
        const card=entry.target.querySelector(".photo-card");
        if(card)card.style.animationDelay=(Math.random()*0.3)+"s";
        observer.unobserve(entry.target);
      }
    });
  },{threshold:0.1});
  tl.querySelectorAll(".tl-item").forEach(item=>observer.observe(item));
}

function faDate(t){
  return new Date(t).toLocaleDateString("fa-IR",{year:"numeric",month:"long",day:"numeric"});
}

function openLB(i){
  currentLB=i;
  const p=photos[i];
  $("#lbImg").src=p.url;
  $("#lbCaption").textContent=p.caption||"تیام جان";
  $("#lbDate").textContent=faDate(p.added_at);
  updateLBLike();
  $("#lightbox").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeLB(){
  $("#lightbox").classList.remove("open");
  document.body.style.overflow="";
  currentLB=-1;
}
function lbStep(d){
  if(!photos.length)return;
  currentLB=(currentLB+d+photos.length)%photos.length;
  openLB(currentLB);
}
function updateLBLike(){
  const p=photos[currentLB];
  const count=likesMap[p.id]||0;
  const liked=localStorage.getItem("liked_"+p.id)==="1";
  $("#lbLikeCount").textContent=fa(count);
  $("#lbLike").classList.toggle("liked",liked);
}
$("#lbClose").onclick=closeLB;
$("#lbPrev").onclick=()=>lbStep(-1);
$("#lbNext").onclick=()=>lbStep(1);
$("#lightbox").onclick=e=>{if(e.target===$("#lightbox"))closeLB();};
$("#lbLike").onclick=async()=>{
  const p=photos[currentLB];
  if(localStorage.getItem("liked_"+p.id)==="1"){
    toast("قبلاً لایک کردی 💗");
    return;
  }
  try{
    const {error}=await sb.from("likes").insert({photo_id:p.id});
    if(error)throw error;
    localStorage.setItem("liked_"+p.id,"1");
    likesMap[p.id]=(likesMap[p.id]||0)+1;
    const countEl=$("#lbLikeCount");
    countEl.textContent=fa(likesMap[p.id]);
    countEl.classList.remove("pop");
    void countEl.offsetWidth;
    countEl.classList.add("pop");
    $("#lbLike").classList.add("liked");
    heartRain();
    fireConfetti();
    loadData();
  }catch(e){
    toast("❌ خطا در لایک");
  }
};
document.addEventListener("keydown",e=>{
  if(currentLB<0)return;
  if(e.key==="Escape")closeLB();
  if(e.key==="ArrowLeft")lbStep(1);
  if(e.key==="ArrowRight")lbStep(-1);
});

function renderComments(comments){
  const box=$("#bookPages");
  box.innerHTML="";
  if(!comments.length){
    box.innerHTML='<div class="book-empty">هنوز یادگاری ثبت نشده. اولین نفر باش! 🌸</div>';
    return;
  }
  comments.slice(0,30).forEach(c=>{
    const page=document.createElement("div");
    page.className="book-page";
    page.innerHTML=`
      <div class="book-author">🌸 ${c.author||"مهمان"}</div>
      <div class="book-text">${c.message||""}</div>
      <div class="book-date">${faDate(c.created_at)}</div>
    `;
    box.appendChild(page);
  });
}
$("#commentForm").onsubmit=async e=>{
  e.preventDefault();
  const name=$("#cName").value.trim()||"مهمان";
  const msg=$("#cMsg").value.trim();
  if(!msg){toast("یه چیزی بنویس! 🌸");return;}
  try{
    const {error}=await sb.from("comments").insert({photo_id:ALBUM_ID,author:name,message:msg});
    if(error)throw error;
    $("#cMsg").value="";
    toast("🌸 یادگاری‌ات ثبت شد!");
    fireConfetti();
    loadData();
  }catch(e){
    toast("❌ خطا در ثبت یادگاری");
  }
};

function renderLiked(){
  const box=$("#likedList");
  box.innerHTML="";
  const likedPhotos=photos.filter(p=>(likesMap[p.id]||0)>0)
    .sort((a,b)=>(likesMap[b.id]||0)-(likesMap[a.id]||0))
    .slice(0,12);
  if(!likedPhotos.length){
    $("#likedSection").style.display="none";
    return;
  }
  $("#likedSection").style.display="block";
  likedPhotos.forEach(p=>{
    const idx=photos.findIndex(x=>x.id===p.id);
    const item=document.createElement("div");
    item.className="liked-item";
    item.innerHTML=`<img src="${p.url}" alt=""><div class="badge">❤️ ${fa(likesMap[p.id])}</div>`;
    item.onclick=()=>openLB(idx);
    box.appendChild(item);
  });
}
$("#nightToggle").onclick=()=>{
  document.body.classList.toggle("night");
  const isNight=document.body.classList.contains("night");
  $("#nightToggle").textContent=isNight?"☀️":"🌙";
  localStorage.setItem("nightMode",isNight?"1":"0");
};
if(localStorage.getItem("nightMode")==="1"){
  document.body.classList.add("night");
  $("#nightToggle").textContent="☀️";
}

createBackground();
setupTitle();
setQuote();
updateAge();
setInterval(updateAge,1000);
loadData();
fireConfetti();
</script>
</body>
</html>
