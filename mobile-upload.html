<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>📱 آپلود عکس تیام جان</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Tahoma,sans-serif;color:#123f3a;
  background:linear-gradient(135deg,#eaf6fd,#f2fbf5 40%,#fdf3e7 75%,#fdeef0);
  padding:16px;min-height:100vh}
h1{font-size:1.4rem;text-align:center;margin:14px 0 18px;color:#14655b;font-weight:900}
h1 b{color:#ff6b5e}
.container{max-width:500px;margin:0 auto}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(18,63,58,.12);margin-bottom:14px}
.card h2{font-size:1rem;margin-bottom:12px;color:#14655b;font-weight:700}
.upload-btn{display:block;width:100%;background:linear-gradient(135deg,#ff8a5c,#ff6b5e);color:#fff;
  border:0;border-radius:14px;padding:16px;font-size:1rem;font-weight:700;cursor:pointer;
  font-family:inherit;margin-bottom:10px;-webkit-appearance:none}
.upload-btn:disabled{opacity:.6}
.file-input{display:none}
.status{padding:12px;border-radius:12px;margin:10px 0;font-size:.85rem;line-height:1.7;display:none;word-break:break-word}
.status.ok{display:block;background:#e8f7ee;color:#1d7a35}
.status.err{display:block;background:#fdecea;color:#c0392b}
.status.info{display:block;background:#eef4fb;color:#2c5f8a}
.photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:10px}
.photo-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#eef4f2;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,107,94,.95);color:#fff;border:0;font-size:1rem;cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;
  -webkit-appearance:none}
.photo-del:active{transform:scale(.9)}
.photo-del:disabled{opacity:.5}
.photo-date{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);color:#fff;
  font-size:.65rem;padding:3px 6px;text-align:center}
.refresh-btn{background:#fff;border:2px solid #14655b;color:#14655b;border-radius:12px;padding:10px;
  font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;width:100%;
  -webkit-appearance:none;margin-top:8px}
.empty{text-align:center;color:#8aa6a1;padding:20px;font-size:.88rem}
.count-badge{background:#ff6b5e;color:#fff;padding:2px 8px;border-radius:999px;font-size:.75rem;
  font-weight:700;margin-right:6px}
</style>
</head>
<body>
<div class="container">
  <h1>📱 مدیریت عکس <b>تیام جان</b></h1>
  
  <div class="card">
    <h2>📷 افزودن عکس جدید</h2>
    <button class="upload-btn" id="btnUpload">📸 انتخاب عکس از گالری</button>
    <button class="upload-btn" id="btnCamera">📷 گرفتن عکس با دوربین</button>
    <input type="file" class="file-input" id="fileInput" accept="image/*" multiple>
    <input type="file" class="file-input" id="cameraInput" accept="image/*" capture="environment">
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h2>🖼 عکس‌های آلبوم <span class="count-badge" id="countBadge">0</span></h2>
    <div id="photosList" class="photos-grid"></div>
    <div id="emptyMsg" class="empty" hidden>هنوز عکسی در آلبوم نیست</div>
    <button class="refresh-btn" id="btnRefresh">🔄 به‌روزرسانی لیست</button>
  </div>
</div>
<script>
const CFG={url:"https://kabgmypavsagbomdvzga.supabase.co",anon:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYmdteXBhdnNhZ2JvbWR2emdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Njc0NzksImV4cCI6MjEwMjA0MzQ3OX0.6kNctpCc7Qmj1bihs9clokk70UzX12-oy-wxlsiJKmY"};
const ALBUM_ID="bb7c5a06-a2d4-4b1a-8167-410ca42de9e1";
const BUCKET="album-photos";
const sb=supabase.createClient(CFG.url,CFG.anon);
const $=s=>document.querySelector(s);
const fa=n=>Number(n).toLocaleString("fa-IR");

function makeUUID(){
  if(crypto && crypto.randomUUID){try{return crypto.randomUUID();}catch(e){}}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

function setStatus(msg,type){
  const s=$('#status');
  s.className='status '+(type||'info');
  s.textContent=msg;
}

function faDate(t){return new Date(t).toLocaleDateString('fa-IR');}

async function loadPhotos(){
  const list=$('#photosList');
  list.innerHTML='<div class="empty">⏳ در حال بارگذاری...</div>';
  $('#emptyMsg').hidden=true;
  try{
    const {data,error}=await sb.from('photos').select('*').eq('album_id',ALBUM_ID).order('added_at',{ascending:false});
    if(error)throw error;
    const photos=data||[];
    $('#countBadge').textContent=fa(photos.length);
    if(!photos.length){
      list.innerHTML='';
      $('#emptyMsg').hidden=false;
      return;
    }
    list.innerHTML='';
    photos.forEach(p=>{
      const item=document.createElement('div');
      item.className='photo-item';
      item.innerHTML='<img src="'+p.url+'" alt="">'
        +'<button class="photo-del" data-id="'+p.id+'" data-path="'+p.path+'">🗑</button>'
        +'<div class="photo-date">'+faDate(p.added_at)+'</div>';
      list.appendChild(item);
    });
    // دکمه‌های حذف
    list.querySelectorAll('.photo-del').forEach(btn=>{
      btn.onclick=async()=>{
        if(!confirm('آیا مطمئنی می‌خواهی این عکس را حذف کنی؟'))return;
        btn.disabled=true;
        btn.textContent='...';
        const id=btn.dataset.id;
        const path=btn.dataset.path;
        try{
          const {error:delErr}=await sb.storage.from(BUCKET).remove([path]);
          if(delErr)throw delErr;
          const {error:dbErr}=await sb.from('photos').delete().eq('id',id);
          if(dbErr)throw dbErr;
          setStatus('✅ عکس حذف شد','ok');
          setTimeout(loadPhotos,500);
        }catch(e){
          setStatus('❌ خطا در حذف: '+(e.message||e),'err');
          btn.disabled=false;
          btn.textContent='🗑';
        }
      };
    });
  }catch(e){
    list.innerHTML='<div class="empty">❌ خطا در بارگذاری</div>';
    console.error(e);
  }
}

$('#btnUpload').onclick=()=>$('#fileInput').click();
$('#btnCamera').onclick=()=>$('#cameraInput').click();
$('#btnRefresh').onclick=loadPhotos;

$('#fileInput').onchange=e=>{uploadFiles(e.target.files);e.target.value='';};
$('#cameraInput').onchange=e=>{uploadFiles(e.target.files);e.target.value='';};

async function processFile(f){
  return await new Promise((res,rej)=>{
    const img=new Image();
    const url=URL.createObjectURL(f);
    img.onload=()=>{
      try{
        const w=img.naturalWidth,h=img.naturalHeight;
        const M=1400,s=Math.min(1,M/Math.max(w,h));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(w*s));
        c.height=Math.max(1,Math.round(h*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b=>{if(b)res(b);else rej(new Error('toBlob null'));},'image/jpeg',.85);
      }catch(e){rej(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Image fail'));};
    img.src=url;
  });
}

async function uploadFiles(files){
  const list=Array.from(files).filter(f=>f.type.startsWith('image/'));
  if(!list.length){setStatus('فایلی انتخاب نشد','err');return;}
  $('#btnUpload').disabled=true;
  $('#btnCamera').disabled=true;
  setStatus('📤 در حال آپلود '+fa(list.length)+' عکس...','info');
  let success=0;
  for(let i=0;i<list.length;i++){
    const f=list[i];
    try{
      const blob=await processFile(f);
      const id=makeUUID();
      const path=ALBUM_ID+'/'+id+'.jpg';
      const {error:upErr}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});
      if(upErr)throw upErr;
      const {data:{publicUrl}}=sb.storage.from(BUCKET).getPublicUrl(path);
      const {error:dbErr}=await sb.from('photos').insert({
        id,album_id:ALBUM_ID,path,url:publicUrl,caption:'',
        added_at:new Date().toISOString()
      });
      if(dbErr)throw dbErr;
      success++;
    }catch(e){
      console.error(e);
      setStatus('❌ خطا: '+(e.message||e),'err');
    }
  }
  $('#btnUpload').disabled=false;
  $('#btnCamera').disabled=false;
  if(success>0){
    setStatus('✅ '+fa(success)+' عکس اضافه شد!','ok');
    loadPhotos();
  }
}

// لود اولیه
loadPhotos();
</script>
</body>
</html>
