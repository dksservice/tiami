<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>📱 آپلود عکس تیام جان</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Tahoma,sans-serif;color:#123f3a;
  background:linear-gradient(135deg,#eaf6fd,#f2fbf5 40%,#fdf3e7 75%,#fdeef0);
  padding:16px;min-height:100vh}
h1{font-size:1.4rem;text-align:center;margin:14px 0 18px;color:#14655b;font-weight:900}
h1 b{color:#ff6b5e}
.container{max-width:500px;margin:0 auto}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(18,63,58,.12);margin-bottom:14px}
.upload-btn{display:block;width:100%;background:linear-gradient(135deg,#ff8a5c,#ff6b5e);color:#fff;
  border:0;border-radius:14px;padding:16px;font-size:1rem;font-weight:700;cursor:pointer;
  font-family:inherit;margin-bottom:10px;-webkit-appearance:none}
.upload-btn:disabled{opacity:.6}
.file-input{display:none}
.status{padding:12px;border-radius:12px;margin:10px 0;font-size:.85rem;line-height:1.7;display:none;word-break:break-word}
.status.ok{display:block;background:#e8f7ee;color:#1d7a35}
.status.err{display:block;background:#fdecea;color:#c0392b}
.status.info{display:block;background:#eef4fb;color:#2c5f8a}
.log{background:#1e293b;color:#94e2d5;border-radius:12px;padding:12px;font-size:.72rem;
  font-family:monospace;max-height:250px;overflow:auto;margin-top:12px;white-space:pre-wrap;
  direction:ltr;text-align:left;line-height:1.6}
.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:12px}
.preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<div class="container">
  <h1>📱 آپلود عکس <b>تیام جان</b></h1>
  <div class="card">
    <button class="upload-btn" id="btnUpload">📸 انتخاب عکس از گالری</button>
    <button class="upload-btn" id="btnCamera">📷 گرفتن عکس با دوربین</button>
    <input type="file" class="file-input" id="fileInput" accept="image/*" multiple>
    <input type="file" class="file-input" id="cameraInput" accept="image/*" capture="environment">
    <div id="preview" class="preview"></div>
    <div class="status" id="status"></div>
    <div class="log" id="log"></div>
  </div>
</div>
<script>
const CFG={url:"https://kabgmypavsagbomdvzga.supabase.co",anon:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYmdteXBhdnNhZ2JvbWR2emdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Njc0NzksImV4cCI6MjEwMjA0MzQ3OX0.6kNctpCc7Qmj1bihs9clokk70UzX12-oy-wxlsiJKmY"};
const ALBUM_ID="bb7c5a06-a2d4-4b1a-8167-410ca42de9e1";
const BUCKET="album-photos";
const sb=supabase.createClient(CFG.url,CFG.anon);
const $=s=>document.querySelector(s);
const fa=n=>Number(n).toLocaleString("fa-IR");

// ===== تابع تولید UUID واقعی (حل مشکل) =====
function makeUUID(){
  if(crypto && crypto.randomUUID){
    try{return crypto.randomUUID();}catch(e){}
  }
  // fallback: تولید UUID v4 دستی
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

function log(msg){
  const el=$('#log');
  el.textContent+='['+new Date().toLocaleTimeString('fa-IR')+'] '+msg+'\n';
  el.scrollTop=el.scrollHeight;
}
function setStatus(msg,type){
  const s=$('#status');
  s.className='status '+(type||'info');
  s.textContent=msg;
}

log('✅ صفحه لود شد');
log('🔗 URL: '+CFG.url);
log('📁 ALBUM_ID: '+ALBUM_ID);

$('#btnUpload').onclick=()=>$('#fileInput').click();
$('#btnCamera').onclick=()=>$('#cameraInput').click();
$('#fileInput').onchange=e=>{uploadFiles(e.target.files);e.target.value='';};
$('#cameraInput').onchange=e=>{uploadFiles(e.target.files);e.target.value='';};

async function uploadFiles(files){
  const list=Array.from(files);
  log('📥 تعداد فایل‌های انتخاب‌شده: '+list.length);
  if(!list.length){setStatus('فایلی انتخاب نشد','err');return;}
  
  list.forEach((f,i)=>log('  فایل '+fa(i+1)+': '+f.name+' | '+f.type+' | '+Math.round(f.size/1024)+'KB'));
  
  $('#btnUpload').disabled=true;
  $('#btnCamera').disabled=true;
  
  let success=0,fail=0;
  for(let i=0;i<list.length;i++){
    const f=list[i];
    try{
      setStatus('📤 آپلود '+fa(i+1)+' از '+fa(list.length)+'...','info');
      log('🔄 شروع آپلود: '+f.name);
      
      const blob=await processFile(f);
      log('✅ پردازش عکس تمام شد، سایز: '+Math.round(blob.size/1024)+'KB');
      
      const id=makeUUID(); // ← اینجا ID واقعی UUID ساخته می‌شود
      const path=ALBUM_ID+'/'+id+'.jpg';
      log('📤 آپلود به storage: '+path);
      log('🆔 UUID جدید: '+id);
      
      const {error:upErr}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});
      if(upErr){
        log('❌ خطای storage: '+upErr.message);
        throw upErr;
      }
      log('✅ آپلود storage موفق');
      
      const {data:{publicUrl}}=sb.storage.from(BUCKET).getPublicUrl(path);
      log('🔗 publicUrl: '+publicUrl);
      
      const {error:dbErr}=await sb.from('photos').insert({
        id:id,
        album_id:ALBUM_ID,
        path:path,
        url:publicUrl,
        caption:'',
        added_at:new Date().toISOString()
      });
      if(dbErr){
        log('❌ خطای database: '+dbErr.message);
        throw dbErr;
      }
      log('✅ ثبت در database موفق');
      success++;
    }catch(e){
      fail++;
      log('❌ خطای کلی: '+(e.message||JSON.stringify(e)));
      setStatus('❌ خطا: '+(e.message||e),'err');
    }
  }
  
  $('#btnUpload').disabled=false;
  $('#btnCamera').disabled=false;
  if(success>0){
    setStatus('✅ '+fa(success)+' عکس آپلود شد!'+(fail>0?' ('+fa(fail)+' خطا)':''),'ok');
    log('🎉 تمام شد: '+success+' موفق، '+fail+' ناموفق');
  }else{
    setStatus('❌ هیچ عکسی آپلود نشد.','err');
  }
}

async function processFile(f){
  log('🖼 پردازش عکس شروع شد: '+f.type);
  try{
    return await new Promise((res,rej)=>{
      const img=new Image();
      const url=URL.createObjectURL(f);
      img.onload=()=>{
        try{
          const w=img.naturalWidth,h=img.naturalHeight;
          log('  ابعاد: '+w+'x'+h);
          const M=1400,s=Math.min(1,M/Math.max(w,h));
          const c=document.createElement('canvas');
          c.width=Math.max(1,Math.round(w*s));
          c.height=Math.max(1,Math.round(h*s));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          URL.revokeObjectURL(url);
          c.toBlob(b=>{
            if(b)res(b);
            else rej(new Error('toBlob null شد'));
          },'image/jpeg',.85);
        }catch(e){rej(e);}
      };
      img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Image load fail'));};
      img.src=url;
    });
  }catch(e){
    log('⚠️ پردازش fail شد، فایل اصلی را آپلود می‌کنم: '+e.message);
    return f;
  }
}
</script>
</body>
</html>
